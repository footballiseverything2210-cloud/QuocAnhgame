<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiên Săn Cục Cứt - Snake Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    min-height:100vh;

    background:url("6e46f401-fa81-48d9-b946-f742e1be7b31.png") center center/cover no-repeat fixed;

    font-family:Arial,sans-serif;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    z-index:-1;
}

.container{
    text-align:center;
    width:100%;
    padding:10px;
}

h1{
    color:white;
    margin-bottom:15px;
}

#gameCanvas{
    border:4px solid white;
    border-radius:10px;
    background:#1a1a2e;

    width:95vw;
    height:95vw;

    max-width:600px;
    max-height:600px;

    display:block;
    margin:auto;
}

.scoreboard{
    display:flex;
    justify-content:center;
    gap:20px;

    margin-top:15px;
    flex-wrap:wrap;
}

.score-section{
    background:rgba(255,255,255,.15);
    padding:10px 20px;
    border-radius:12px;
    color:white;
}

.score{
    font-size:28px;
    color:gold;
}

.controls{
    margin-top:15px;
    color:white;
}

.button-group{
    margin-top:15px;
}

button{
    padding:12px 18px;
    margin:5px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:18px;
}

.mobile-controls{
    margin-top:20px;
    display:grid;
    grid-template-columns:80px 80px 80px;
    gap:10px;
    justify-content:center;
}

.mobile-controls button{
    width:80px;
    height:80px;
    font-size:28px;
}
</style>
</head>

<body>

<div class="container">

<h1>🐍 KIÊN SĂN CỤC CỨT 💩</h1>

<canvas id="gameCanvas"></canvas>

<div class="scoreboard">

<div class="score-section">
Score
<div class="score" id="score">0</div>
</div>

<div class="score-section">
Dài
<div class="score" id="length">1</div>
</div>

<div class="score-section">
Speed
<div class="score" id="speed">Chậm</div>
</div>

</div>

<div class="controls">
⬆️⬇️⬅️➡️ hoặc vuốt màn hình
</div>

<div class="button-group">
<button onclick="startGame()">Start</button>
<button onclick="resetGame()">Reset</button>
</div>

<div class="mobile-controls">

<div></div>
<button onclick="setDir(0,-1)">⬆️</button>
<div></div>

<button onclick="setDir(-1,0)">⬅️</button>
<button onclick="setDir(0,1)">⬇️</button>
<button onclick="setDir(1,0)">➡️</button>

</div>

</div>

<script>

const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

canvas.width=600;
canvas.height=600;

const gridSize=20;
const tileCount=30;

let snake=[{x:15,y:15}];

let food={
x:10,
y:10
};

let direction={x:1,y:0};
let nextDirection={x:1,y:0};

let score=0;
let running=false;
let gameOver=false;

function setDir(x,y){

if(x!==0 && direction.x===0)
nextDirection={x,y};

if(y!==0 && direction.y===0)
nextDirection={x,y};

}

window.addEventListener("keydown",(e)=>{

if((e.key==="ArrowUp"||e.key==="w") && direction.y===0)
nextDirection={x:0,y:-1};

if((e.key==="ArrowDown"||e.key==="s") && direction.y===0)
nextDirection={x:0,y:1};

if((e.key==="ArrowLeft"||e.key==="a") && direction.x===0)
nextDirection={x:-1,y:0};

if((e.key==="ArrowRight"||e.key==="d") && direction.x===0)
nextDirection={x:1,y:0};

});

let startX=0;
let startY=0;

canvas.addEventListener("touchstart",(e)=>{

startX=e.touches[0].clientX;
startY=e.touches[0].clientY;

});

canvas.addEventListener("touchend",(e)=>{

let dx=e.changedTouches[0].clientX-startX;
let dy=e.changedTouches[0].clientY-startY;

if(Math.abs(dx)>Math.abs(dy)){

if(dx>30) setDir(1,0);

if(dx<-30) setDir(-1,0);

}else{

if(dy>30) setDir(0,1);

if(dy<-30) setDir(0,-1);

}

});

function speedText(){

if(snake.length<8) return "Chậm";

if(snake.length<15) return "Nhanh";

return "⚡";

}

function generateFood(){

do{

food.x=Math.floor(Math.random()*tileCount);

food.y=Math.floor(Math.random()*tileCount);

}while(
snake.some(
s=>s.x===food.x && s.y===food.y
)
);

}

function update(){

if(!running||gameOver) return;

direction=nextDirection;

let head={

x:snake[0].x+direction.x,
y:snake[0].y+direction.y

};

if(head.x<0) head.x=tileCount-1;
if(head.x>=tileCount) head.x=0;

if(head.y<0) head.y=tileCount-1;
if(head.y>=tileCount) head.y=0;

for(let s of snake){

if(s.x===head.x && s.y===head.y){

gameOver=true;

return;

}

}

snake.unshift(head);

if(head.x===food.x && head.y===food.y){

score+=10;

generateFood();

}else{

snake.pop();

}

document.getElementById("score").textContent=score;

document.getElementById("length").textContent=snake.length;

document.getElementById("speed").textContent=speedText();

}

function draw(){

ctx.fillStyle="#1a1a2e";
ctx.fillRect(0,0,600,600);

snake.forEach((s,i)=>{

ctx.fillStyle=i===0 ? "#00ff88":"#00cc66";

ctx.fillRect(
s.x*gridSize,
s.y*gridSize,
18,
18
);

});

ctx.font="18px Arial";
ctx.fillText(
"💩",
food.x*gridSize+2,
food.y*gridSize+18
);

if(gameOver){

ctx.fillStyle="white";

ctx.font="40px Arial";

ctx.fillText(
"GAME OVER",
180,
300
);

}

}

function loop(){

update();

draw();

setTimeout(
()=>requestAnimationFrame(loop),
120-Math.min(
(snake.length-1)*4,
80
)
);

}

function startGame(){

running=true;

}

function resetGame(){

snake=[{x:15,y:15}];

score=0;

direction={x:1,y:0};

nextDirection={x:1,y:0};

gameOver=false;

running=false;

generateFood();

}

generateFood();

loop();

</script>

</body>
</html>

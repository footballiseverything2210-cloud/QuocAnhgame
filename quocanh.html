<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        #gameCanvas {
            border: 3px solid white;
            background-color: #1a1a2e;
            display: block;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            cursor: none;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            width: 600px;
            margin-top: 20px;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .score-section {
            color: white;
            font-size: 1.5em;
            font-weight: bold;
        }

        .score-section h2 {
            font-size: 1.2em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .score {
            font-size: 2em;
            color: #ffd700;
        }

        .controls {
            color: white;
            margin-top: 20px;
            font-size: 0.9em;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            max-width: 600px;
            backdrop-filter: blur(10px);
        }

        .controls h3 {
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls p {
            margin: 5px 0;
        }

        .button-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            background-color: #667eea;
            color: white;
            border: 2px solid white;
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        button:hover {
            background-color: #764ba2;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            #gameCanvas {
                max-width: 100vw;
            }

            .scoreboard {
                width: 90vw;
                max-width: 600px;
            }

            .controls {
                width: 90vw;
                max-width: 600px;
                font-size: 0.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏓 PONG GAME</h1>
        <canvas id="gameCanvas" width="600" height="400"></canvas>

        <div class="scoreboard">
            <div class="score-section">
                <h2>Player</h2>
                <div class="score" id="playerScore">0</div>
            </div>
            <div class="score-section">
                <h2>Computer</h2>
                <div class="score" id="computerScore">0</div>
            </div>
        </div>

        <div class="controls">
            <h3>Controls</h3>
            <p>🖱️ Mouse Y Position or ⬆️⬇️ Arrow Keys to Move Left Paddle</p>
            <p>Computer controls the right paddle automatically</p>
            <p>First to 5 points wins! 🎉</p>
        </div>

        <div class="button-group">
            <button onclick="startGame()">Start Game</button>
            <button onclick="resetGame()">Reset</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const paddleHeight = 80;
        const paddleWidth = 15;
        const ballSize = 8;

        let playerPaddle = {
            x: 10,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            dy: 0,
            speed: 5
        };

        let computerPaddle = {
            x: canvas.width - paddleWidth - 10,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            speed: 3.5
        };

        let ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            dx: 5,
            dy: 5,
            radius: ballSize,
            maxSpeed: 8
        };

        let gameState = {
            playerScore: 0,
            computerScore: 0,
            gameRunning: false,
            gameWon: false,
            winningPlayer: null
        };

        const keys = {};

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === 'ArrowUp') {
                playerPaddle.dy = -playerPaddle.speed;
            } else if (e.key === 'ArrowDown') {
                playerPaddle.dy = playerPaddle.speed;
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                playerPaddle.dy = 0;
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseY = e.clientY - rect.top;
            let newY = mouseY - paddleHeight / 2;
            newY = Math.max(0, Math.min(newY, canvas.height - paddleHeight));
            playerPaddle.y = newY;
        });

        function drawRectangle(x, y, width, height, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, width, height);
        }

        function drawCircle(x, y, radius, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawDashedLine() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawGame() {
            drawRectangle(0, 0, canvas.width, canvas.height, '#1a1a2e');
            drawDashedLine();
            drawRectangle(playerPaddle.x, playerPaddle.y, playerPaddle.width, playerPaddle.height, '#00ff88');
            drawRectangle(computerPaddle.x, computerPaddle.y, computerPaddle.width, computerPaddle.height, '#ff0055');
            drawCircle(ball.x, ball.y, ball.radius, '#ffd700');

            ctx.fillStyle = 'white';
            ctx.font = '20px Arial';
            ctx.fillText('Player: ' + gameState.playerScore, 20, 30);
            ctx.fillText('Computer: ' + gameState.computerScore, canvas.width - 200, 30);

            if (!gameState.gameRunning && !gameState.gameWon) {
                ctx.font = 'bold 30px Arial';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.textAlign = 'center';
                ctx.fillText('Press Start to Begin', canvas.width / 2, canvas.height / 2);
                ctx.textAlign = 'left';
            }

            if (gameState.gameWon) {
                ctx.font = 'bold 40px Arial';
                ctx.fillStyle = '#ffd700';
                ctx.textAlign = 'center';
                const winner = gameState.winningPlayer === 'player' ? '🎉 YOU WIN! 🎉' : '💻 COMPUTER WINS! 💻';
                ctx.fillText(winner, canvas.width / 2, canvas.height / 2);
                ctx.font = '20px Arial';
                ctx.fillStyle = 'white';
                ctx.fillText('Press Reset to Play Again', canvas.width / 2, canvas.height / 2 + 40);
                ctx.textAlign = 'left';
            }
        }

        function updateBall() {
            ball.x += ball.dx;
            ball.y += ball.dy;

            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.dy = -ball.dy;
                ball.y = Math.max(ball.radius, Math.min(canvas.height - ball.radius, ball.y));
            }

            if (
                ball.x - ball.radius < playerPaddle.x + playerPaddle.width &&
                ball.y > playerPaddle.y &&
                ball.y < playerPaddle.y + playerPaddle.height
            ) {
                ball.dx = -ball.dx;
                ball.x = playerPaddle.x + playerPaddle.width + ball.radius;
                const hitPos = (ball.y - (playerPaddle.y + playerPaddle.height / 2)) / (playerPaddle.height / 2);
                ball.dy += hitPos * 3;
                ball.dx = Math.max(-ball.maxSpeed, Math.min(ball.maxSpeed, ball.dx));
                ball.dy = Math.max(-ball.maxSpeed, Math.min(ball.maxSpeed, ball.dy));
            }

            if (
                ball.x + ball.radius > computerPaddle.x &&
                ball.y > computerPaddle.y &&
                ball.y < computerPaddle.y + computerPaddle.height
            ) {
                ball.dx = -ball.dx;
                ball.x = computerPaddle.x - ball.radius;
                const hitPos = (ball.y - (computerPaddle.y + computerPaddle.height / 2)) / (computerPaddle.height / 2);
                ball.dy += hitPos * 3;
                ball.dx = Math.max(-ball.maxSpeed, Math.min(ball.maxSpeed, ball.dx));
                ball.dy = Math.max(-ball.maxSpeed, Math.min(ball.maxSpeed, ball.dy));
            }

            if (ball.x - ball.radius < 0) {
                gameState.computerScore++;
                if (gameState.computerScore >= 5) {
                    gameState.gameRunning = false;
                    gameState.gameWon = true;
                    gameState.winningPlayer = 'computer';
                }
                resetBall();
            } else if (ball.x + ball.radius > canvas.width) {
                gameState.playerScore++;
                if (gameState.playerScore >= 5) {
                    gameState.gameRunning = false;
                    gameState.gameWon = true;
                    gameState.winningPlayer = 'player';
                }
                resetBall();
            }

            updateScoreboard();
        }

        function updateComputerPaddle() {
            const computerCenter = computerPaddle.y + computerPaddle.height / 2;
            const ballCenter = ball.y;

            if (computerCenter < ballCenter - 35) {
                computerPaddle.y += computerPaddle.speed;
            } else if (computerCenter > ballCenter + 35) {
                computerPaddle.y -= computerPaddle.speed;
            }

            computerPaddle.y = Math.max(0, Math.min(canvas.height - computerPaddle.height, computerPaddle.y));
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * 5;
            ball.dy = (Math.random() - 0.5) * 8;
        }

        function updateScoreboard() {
            document.getElementById('playerScore').textContent = gameState.playerScore;
            document.getElementById('computerScore').textContent = gameState.computerScore;
        }

        function gameLoop() {
            if (gameState.gameRunning) {
                updateBall();
                updateComputerPaddle();
            }

            drawGame();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            if (!gameState.gameRunning && !gameState.gameWon) {
                gameState.gameRunning = true;
                resetBall();
            }
        }

        function resetGame() {
            gameState.playerScore = 0;
            gameState.computerScore = 0;
            gameState.gameRunning = false;
            gameState.gameWon = false;
            gameState.winningPlayer = null;
            resetBall();
            playerPaddle.y = canvas.height / 2 - paddleHeight / 2;
            computerPaddle.y = canvas.height / 2 - paddleHeight / 2;
            updateScoreboard();
        }

        updateScoreboard();
        gameLoop();
    </script>
</body>
</html>
